<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test Styled PDF</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #103138;
      margin: 40px;
    }
    h1 {
      color: #20E28F;
      border-bottom: 2px solid #20E28F;
      padding-bottom: 10px;
    }
    .info-box {
      background-color: #f9f9f9;
      border-left: 5px solid #20E28F;
      padding: 20px;
      margin: 20px 0;
    }
    .green-text {
      color: #20E28F;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Test AI Scorecard</h1>
  <div class="info-box">
    <h3>User Information</h3>
    <p><span class="green-text">Name:</span> Test User</p>
    <p><span class="green-text">Company:</span> Test Company</p>
  </div>
  <p>This should be a styled PDF with green colors and proper formatting.</p>
</body>
</html>
